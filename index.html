<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTC Team 35849 | ARCNICK</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&amp;family=Rajdhani:wght@500;700&amp;display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
    --bg-color: #0a0505;
    --card-bg: #140a0a;
    --primary: #ff2d5f;
    --primary-glow: rgba(255, 45, 95, 0.4);
    --accent: #ffffff;
    --text-main: #ffffff;
    --text-muted: #c9a3a3;
    --font-display: 'Orbitron', sans-serif;
    --font-body: 'Rajdhani', sans-serif;
}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-body);
            font-size: 1.2rem;
            overflow-x: hidden;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        /* Navigation Bar */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.5rem 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 5, 8, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 243, 255, 0.1);
            z-index: 1000;
        }
        .logo {
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 1.8rem;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: 2px;
        }
        .logo span {
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary-glow);
        }
        .nav-links {
            display: flex;
            list-style: none;
            gap: 2.5rem;
        }
        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .nav-links a:hover, .nav-links a.active {
            color: var(--primary);
            text-shadow: 0 0 8px var(--primary-glow);
        }
        /* Hero Section */
        header {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 1rem;
            position: relative;
        }
        .hero-badge {
            font-family: var(--font-display);
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 0.4rem 1.2rem;
            border-radius: 4px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 1.5rem;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            animation: pulse 2s infinite;
        }
        h1 {
            font-family: var(--font-display);
            font-size: 5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            line-height: 1.1;
            margin-bottom: 1rem;
        }
        h1 .badge-num {
            color: transparent;
            -webkit-text-stroke: 1.5px var(--primary);
            filter: drop-shadow(0 0 10px var(--primary-glow));
        }
        /* ARCNICK dynamic scramble/decode effect */
        #scramble-word {
            display: inline-block;
        }
        #scramble-word .scramble-char {
            color: var(--primary);
            opacity: 0.85;
            text-shadow: 0 0 8px var(--primary-glow);
        }
        #scramble-word .arc-letters {
            color: var(--text-main);
        }
        #scramble-word .nick-letters {
            color: var(--text-main);
            transition: color 1.4s ease, text-shadow 1.4s ease;
        }
        #scramble-word .nick-letters.cyan-active {
            color: var(--primary);
            text-shadow: 0 0 12px var(--primary-glow), 0 0 26px var(--primary-glow);
        }
        .motto {
            font-family: var(--font-display);
            font-size: 1.8rem;
            color: var(--text-muted);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 3rem;
        }
        .motto span {
            color: var(--primary);
            font-weight: 700;
        }
        .btn {
            display: inline-block;
            font-family: var(--font-display);
            font-weight: 700;
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 2px;
            padding: 1rem 2.5rem;
            border-radius: 4px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .btn-primary {
            background: var(--primary);
            color: var(--bg-color);
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .btn-primary:hover {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            box-shadow: 0 0 30px var(--primary-glow);
            transform: translateY(-3px);
        }
        /* Sections Grid Layout */
        section {
            padding: 8rem 10% 4rem 10%;
            max-width: 1400px;
            margin: 0 auto;
        }
        .section-title {
            font-family: var(--font-display);
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 3rem;
            position: relative;
            display: inline-block;
        }
        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 50px;
            height: 4px;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }
        /* Cards and Layout Components */
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            padding: 2.5rem;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 0;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
            transition: all 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 243, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .card:hover::before {
            height: 100%;
        }
        .card i {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
            text-shadow: 0 0 10px var(--primary-glow);
        }
        .card h3 {
            font-family: var(--font-display);
            font-size: 1.5rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }
        .card p {
            color: var(--text-muted);
            line-height: 1.6;
        }
        /* Showroom (Robot Highlights) */
        .showroom-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }
        .robot-visual {
            background: linear-gradient(135deg, rgba(13, 15, 20, 0.8), rgba(5, 5, 8, 0.9));
            border: 2px dashed rgba(0, 243, 255, 0.3);
            border-radius: 8px;
            height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            position: relative;
        }
        .robot-visual i {
            font-size: 4rem;
            color: var(--primary);
            margin-bottom: 1rem;
            animation: float 4s ease-in-out infinite;
        }
        /* Contact & Sponsorship Form */
        .contact-container {
            max-width: 700px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid rgba(0, 243, 255, 0.1);
            padding: 3rem;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            font-family: var(--font-display);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }
        .form-group input, .form-group textarea {
            width: 100%;
            background: rgba(5, 5, 8, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem;
            color: var(--text-main);
            font-family: var(--font-body);
            font-size: 1.2rem;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }
        /* Updates: YouTube + Events */
        .event-row {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 4px;
            padding: 1rem 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }
        .event-row span {
            color: var(--text-main);
        }
        .event-remove-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
            transition: color 0.2s ease;
        }
        .event-remove-btn:hover {
            color: var(--primary);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
        }
        .btn-outline:hover {
            background: var(--primary);
            color: var(--bg-color);
        }
        /* Footer pixel bar styling */
        footer {
            background: #090b0e;
            padding: 3rem 10%;
            border-top: 4px solid var(--primary);
            text-align: center;
            font-family: var(--font-display);
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }
        /* Animations */
        @keyframes pulse {
            0% { box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); }
            50% { box-shadow: 0 0 25px rgba(0, 243, 255, 0.5); }
            100% { box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); }
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        /* Responsive Settings */
        @media (max-width: 900px) {
            h1 { font-size: 3.5rem; }
            .nav-links { display: none; }
            .showroom-container { grid-template-columns: 1fr; gap: 2rem; }
            section { padding: 6rem 5% 2rem 5%; }
        }
    </style>
